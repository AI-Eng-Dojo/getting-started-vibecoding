<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="${title} — バイブコーディング実践入門のハンズオン解説スライド">
  <title>${title} | バイブコーディング実践入門</title>
  <link rel="stylesheet" href="../assets/slides.css">
  <script src="../assets/slides.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#slides">スライド本文へ</a>
  <header class="deck-header">
    <a class="workshop-name" href="../../"><span class="workshop-symbol" aria-hidden="true">✳</span> バイブコーディング実践入門</a>
    <nav aria-label="教材への移動">
      <span class="deck-label">${label}</span>
      <a href="../">スライド一覧 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="slides" id="slides" aria-label="${title}">
${sections}
  </main>
  <noscript><p class="no-script-note">すべてのスライドを縦に表示しています。印刷にも対応しています。</p></noscript>
  <nav class="deck-controls" aria-label="スライド操作" hidden>
    <div class="navigation-controls">
      <button type="button" class="arrow-button" id="previous-slide" aria-label="前のスライド" title="前のスライド（←）">←</button>
      <label class="visually-hidden" for="slide-jump">スライドを選ぶ</label>
      <select id="slide-jump" aria-label="スライドを選ぶ">
${options}
      </select>
      <span class="slide-count"><span id="current-slide">1</span> / ${total}</span>
      <button type="button" class="arrow-button" id="next-slide" aria-label="次のスライド" title="次のスライド（→）">→</button>
    </div>
    <div class="view-controls">
      <span class="keyboard-hint" aria-hidden="true">← → で移動</span>
      <button type="button" id="overview-toggle" aria-pressed="false" title="全スライドを一覧表示（O）">一覧</button>
      <button type="button" id="fullscreen-toggle" aria-pressed="false" title="全画面表示（F）">全画面</button>
      <button type="button" id="print-slides" title="全スライドを印刷">印刷</button>
    </div>
  </nav>
  <p id="deck-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
