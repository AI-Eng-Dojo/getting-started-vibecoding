name: GitHub Pagesに教材を公開

# 教材をHTMLサイトとしてビルドし、GitHub Pagesへ公開する。
# 参加者はリポジトリをcloneしない前提なので、ここが唯一の導線になる。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1本ずつ。走行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: 依存をインストール
        run: pip install -r requirements-site.txt

      - name: サイトをビルド
        # build-site.py が .site-src/ を組み立てて mkdocs build --strict を呼ぶ。
        # --strict なので、リンク切れ・アンカー切れの警告があれば落ちる
        run: python .github/scripts/build-site.py

      - name: 生成後のHTMLのリンクをたどって確認
        run: python .github/scripts/check-site-links.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # PRではビルドの確認だけ。公開は main に入ってから
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
